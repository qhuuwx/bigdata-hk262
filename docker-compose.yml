# ==============================================================================
# Docker Compose - Multi-Container Orchestration
# Big Data Demand Forecasting & Smart Inventory System (bigdata_inventory)
# Version: 3.8
# Services: backend (Node 18 Express API), frontend (Nginx Alpine reverse proxy)
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bigdata_inventory_backend
    ports:
      - "${PORT_BACKEND:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - inventory-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigdata_inventory_frontend
    ports:
      - "${PORT_FRONTEND:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge
