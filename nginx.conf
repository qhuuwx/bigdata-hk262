# ==============================================================================
# Nginx Configuration - bigdata_inventory
# Serves static frontend assets and reverse-proxies /api/ to backend:3000
# Supports both REST APIs and long-lived Server-Sent Events (SSE) streams
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for static assets and API data payloads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Frontend Single Page Application routing with index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-Sent Events (SSE) Streaming Endpoints (/api/stream/sales/events & /api/inventory/stream/events)
    location ~ ^/api/(stream/sales|inventory/stream)/events$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and caching for real-time event streams
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 90s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Standard API Reverse Proxy to Node.js backend container
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        # Connection & header forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Resilient timeouts for in-memory CSV loading & intensive analytical queries
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffer allocation for streaming batches and large EDA payloads
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Custom error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
